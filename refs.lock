## 红线

1. **`refs/` 绝不 COPY 进镜像**，也不作为 git submodule / subtree 引入本仓库。
2. **AGPL-3.0 三个（ARTEX-EN / BoxPwnr / Cairn）**：只读设计，不复制代码片段 —— 否则触发传染性许可义务。
3. **无 LICENSE 三个（aide-for-pentest / Tsec-Hackathon / xbow-competition）**：只读，不复制、不转发源码副本。
4. **不把上届题解、答辩 PPT 内容、flag 字面量喂进 prompt 或镜像**（平台作弊条款 + 全程审计）。见 `docs/architecture.md` §10.4。
