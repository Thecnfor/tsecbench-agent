# 参考实现清单（refs/ 不入库）

`refs/` 已被 `.gitignore` 排除，原因见 `.gitignore` 注释与下方「许可证」列 —— 其中三个仓库**没有 LICENSE 文件**，即默认保留所有权利，无权再分发进公开仓库。

本文件的作用是**让调研可复现**：任何人按 URL + commit 重新 clone 即可得到与本文档结论所依据的完全相同的源码快照。

生成时间：2026-10-10 · 全部为 `--depth 1` 浅克隆 · 总计 14 个仓库约 467MB

